name: Test Isolation

# Verify each test script can run independently in a fresh container
# (issue #4). Every matrix job spins up the docker-compose stack from
# scratch, executes a single test script via test-client, and tears the
# stack down with volumes wiped. Any cross-script ordering dependency
# would surface here as a failed job.

# Every PR must report each required context, including documentation-only PRs.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.paths.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether Docker tests are required
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/ci_runtime_changes.py --event "$EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  test-custom-port:
    name: non-default internal DICOM port
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    env:
      DICOM_PORT: '12012'
      GENERATE_PIXEL_DATA: 'true'
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this context completes without Docker.'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.runtime == 'true'
      - name: Start on the configured port
        if: needs.changes.outputs.runtime == 'true'
        run: |
          cp env.default .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: Run real CLI suites on the configured port
        if: needs.changes.outputs.runtime == 'true'
        run: ./pacs.sh test all
      - name: Verify restricted overlay on the configured port
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose -f docker-compose.yml -f docker-compose.restricted.yml up -d --no-build --wait --wait-timeout 120
          docker compose -f docker-compose.yml -f docker-compose.restricted.yml exec -T test-client /tests/test-restricted-mode.sh
      - name: Dump logs on failure
        if: needs.changes.outputs.runtime == 'true' && failure()
        run: docker compose logs --no-color
      - name: Tear down stack
        if: needs.changes.outputs.runtime == 'true' && always()
        run: docker compose -f docker-compose.yml -f docker-compose.restricted.yml down -v

  test-storage-integrity:
    name: concurrent storage and recovery integrity
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GENERATE_PIXEL_DATA: 'true'
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this required context completes without Docker.'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.runtime == 'true'
      - name: Start isolated stack
        if: needs.changes.outputs.runtime == 'true'
        run: |
          cp env.default .env
          docker compose up -d --build --wait --wait-timeout 120
      - name: Verify concurrency, bidirectional transfer, and recovery
        if: needs.changes.outputs.runtime == 'true'
        run: bash scripts/test-storage-recovery.sh
      - name: Collect integrity evidence
        if: needs.changes.outputs.runtime == 'true' && (always())
        run: |
          docker compose logs --no-color > storage-integrity-server.log
          docker compose exec -T test-client sh -c \
            "find /tmp -maxdepth 1 -type d -name 'concurrent-store-*' -print0 | tar --null -T - -czf -" \
            > storage-integrity-workspaces.tgz
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.runtime == 'true' && (always())
        with:
          name: storage-integrity-evidence
          path: |
            storage-integrity-server.log
            storage-integrity-workspaces.tgz
      - name: Tear down isolated stack
        if: needs.changes.outputs.runtime == 'true' && (always())
        run: docker compose down -v

  test-isolation:
    name: ${{ matrix.test }} (isolated)
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - test-echo.sh
          - test-store.sh
          - test-find.sh
          - test-move.sh
          - test-worklist.sh
          - test-adhoc-peers.sh
          - test-transfer-syntax.sh
          - test-load-smoke.sh
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this required context completes without Docker.'
      - name: Checkout
        if: needs.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4

      - name: Stage .env from defaults
        if: needs.changes.outputs.runtime == 'true'
        run: cp env.default .env

      - name: Build and start stack
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose up -d --build
          # Give services a moment to settle past their start_period
          sleep 5

      - name: Wait for all SCP services to be healthy
        if: needs.changes.outputs.runtime == 'true'
        run: |
          services="pacs-server pacs-server-2 storescp-receiver mwl-server"
          for i in $(seq 1 60); do
            pending=""
            for svc in $services; do
              cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
              if [ -n "$cid" ]; then
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "starting")
              else
                status="starting"
              fi
              if [ "$status" != "healthy" ]; then
                pending="$pending $svc=$status"
              fi
            done
            if [ -z "$pending" ]; then
              echo "All SCP services are healthy"
              exit 0
            fi
            echo "waiting for SCP services (attempt $i/60, pending:$pending)"
            sleep 2
          done
          echo "ERROR: not all SCP services became healthy in time"
          for svc in $services; do
            cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
            if [ -n "$cid" ]; then
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "missing")
            else
              status="missing"
            fi
            if [ "$status" != "healthy" ]; then
              echo "=== $svc not healthy (status: $status); logs ==="
              docker compose logs --tail=100 "$svc" || true
            fi
          done
          exit 1

      - name: Wipe PACS storage on the host before test-store.sh
        # test-store.sh requires an empty PACS so its >= 3 study-count
        # check is meaningful. The PACS entrypoint indexes synthetic test
        # data on first boot, so cleanup must run on the host (the
        # test-client image has no Docker CLI). See issue #19.
        #
        # The entrypoint re-indexes test data on every container start
        # unless a .indexed marker exists. After wiping storage we recreate
        # the marker so the restart leaves PACS empty rather than re-
        # populating it from /dicom/testdata. See scripts/entrypoint.sh.
        if: needs.changes.outputs.runtime == 'true' && (matrix.test == 'test-store.sh')
        run: |
          for svc in pacs-server pacs-server-2; do
            docker compose exec -T "$svc" sh -c '
              find /dicom/db -mindepth 1 -delete 2>/dev/null || true
              mkdir -p "/dicom/db/${AE_TITLE}"
              touch "/dicom/db/${AE_TITLE}/.indexed"
            '
          done
          docker compose restart pacs-server pacs-server-2
          for i in $(seq 1 60); do
            cid=$(docker compose ps -q pacs-server)
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "pacs-server healthy after cleanup"
              break
            fi
            echo "waiting for PACS after cleanup (attempt $i/60)"
            sleep 2
          done
          test "$status" = healthy

      - name: Run ${{ matrix.test }} in isolation
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose exec -T test-client /tests/${{ matrix.test }}

      - name: Dump logs on failure
        if: needs.changes.outputs.runtime == 'true' && (failure())
        run: |
          echo "=== pacs-server logs ==="
          docker compose logs pacs-server || true
          echo "=== pacs-server-2 logs ==="
          docker compose logs pacs-server-2 || true
          echo "=== storescp-receiver logs ==="
          docker compose logs storescp-receiver || true
          echo "=== test-client logs ==="
          docker compose logs test-client || true

      - name: Tear down stack
        if: needs.changes.outputs.runtime == 'true' && (always())
        run: docker compose down -v

  test-pixeldata:
    name: test-pixeldata.sh with GENERATE_PIXEL_DATA=true
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this required context completes without Docker.'
      - name: Checkout
        if: needs.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4

      - name: Stage .env from defaults with PixelData enabled
        if: needs.changes.outputs.runtime == 'true'
        run: |
          cp env.default .env
          # Flip the opt-in switch and verify it took
          sed -i 's/^GENERATE_PIXEL_DATA=.*/GENERATE_PIXEL_DATA=true/' .env
          grep '^GENERATE_PIXEL_DATA=true' .env

      - name: Build and start stack
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose up -d --build
          sleep 5

      - name: Wait for all SCP services to be healthy
        if: needs.changes.outputs.runtime == 'true'
        run: |
          services="pacs-server pacs-server-2 storescp-receiver mwl-server"
          for i in $(seq 1 60); do
            pending=""
            for svc in $services; do
              cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
              if [ -n "$cid" ]; then
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "starting")
              else
                status="starting"
              fi
              if [ "$status" != "healthy" ]; then
                pending="$pending $svc=$status"
              fi
            done
            if [ -z "$pending" ]; then
              echo "All SCP services are healthy"
              exit 0
            fi
            echo "waiting for SCP services (attempt $i/60, pending:$pending)"
            sleep 2
          done
          echo "ERROR: not all SCP services became healthy in time"
          for svc in $services; do
            cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
            if [ -n "$cid" ]; then
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "missing")
            else
              status="missing"
            fi
            if [ "$status" != "healthy" ]; then
              echo "=== $svc not healthy (status: $status); logs ==="
              docker compose logs --tail=100 "$svc" || true
            fi
          done
          exit 1

      - name: Run test-pixeldata.sh
        if: needs.changes.outputs.runtime == 'true'
        run: docker compose exec -T -e GENERATE_PIXEL_DATA=true test-client /tests/test-pixeldata.sh

      - name: Verify findscu/movescu still recognize the files
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose exec -T test-client /tests/test-find.sh
          docker compose exec -T test-client /tests/test-move.sh

      - name: Dump logs on failure
        if: needs.changes.outputs.runtime == 'true' && (failure())
        run: |
          docker compose logs pacs-server || true
          docker compose logs test-client || true

      - name: Tear down stack
        if: needs.changes.outputs.runtime == 'true' && (always())
        run: docker compose down -v

  test-store-idempotency:
    name: test-store.sh twice (idempotency)
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this required context completes without Docker.'
      - name: Checkout
        if: needs.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4

      - name: Stage .env from defaults
        if: needs.changes.outputs.runtime == 'true'
        run: cp env.default .env

      - name: Build and start stack
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose up -d --build
          sleep 5

      - name: Wait for all SCP services to be healthy
        if: needs.changes.outputs.runtime == 'true'
        run: |
          services="pacs-server pacs-server-2 storescp-receiver mwl-server"
          for i in $(seq 1 60); do
            pending=""
            for svc in $services; do
              cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
              if [ -n "$cid" ]; then
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "starting")
              else
                status="starting"
              fi
              if [ "$status" != "healthy" ]; then
                pending="$pending $svc=$status"
              fi
            done
            if [ -z "$pending" ]; then
              echo "All SCP services are healthy"
              exit 0
            fi
            echo "waiting for SCP services (attempt $i/60, pending:$pending)"
            sleep 2
          done
          echo "ERROR: not all SCP services became healthy in time"
          for svc in $services; do
            cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
            if [ -n "$cid" ]; then
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "missing")
            else
              status="missing"
            fi
            if [ "$status" != "healthy" ]; then
              echo "=== $svc not healthy (status: $status); logs ==="
              docker compose logs --tail=100 "$svc" || true
            fi
          done
          exit 1

      - name: Wipe PACS storage on the host before first run
        if: needs.changes.outputs.runtime == 'true'
        # The PACS entrypoint indexes synthetic test data on first boot,
        # so the volumes are dirty even before any storescu. Cleanup must
        # run on the host (the test-client image has no Docker CLI). See
        # issue #19.
        #
        # The entrypoint re-indexes test data on every container start
        # unless a .indexed marker exists. After wiping storage we recreate
        # the marker so the restart leaves PACS empty rather than re-
        # populating it from /dicom/testdata. See scripts/entrypoint.sh.
        run: |
          for svc in pacs-server pacs-server-2; do
            docker compose exec -T "$svc" sh -c '
              find /dicom/db -mindepth 1 -delete 2>/dev/null || true
              mkdir -p "/dicom/db/${AE_TITLE}"
              touch "/dicom/db/${AE_TITLE}/.indexed"
            '
          done
          docker compose restart pacs-server pacs-server-2
          for i in $(seq 1 60); do
            cid=$(docker compose ps -q pacs-server)
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "pacs-server healthy after cleanup"
              break
            fi
            echo "waiting for PACS after cleanup (attempt $i/60)"
            sleep 2
          done
          test "$status" = healthy

      - name: First test-store.sh run
        if: needs.changes.outputs.runtime == 'true'
        run: docker compose exec -T test-client /tests/test-store.sh

      - name: Wipe PACS storage on the host between runs
        if: needs.changes.outputs.runtime == 'true'
        # Same marker trick as before to keep the second run starting from
        # an empty PACS. See the comment on the first wipe step.
        run: |
          for svc in pacs-server pacs-server-2; do
            docker compose exec -T "$svc" sh -c '
              find /dicom/db -mindepth 1 -delete 2>/dev/null || true
              mkdir -p "/dicom/db/${AE_TITLE}"
              touch "/dicom/db/${AE_TITLE}/.indexed"
            '
          done
          docker compose restart pacs-server pacs-server-2
          for i in $(seq 1 60); do
            cid=$(docker compose ps -q pacs-server)
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "pacs-server healthy after cleanup"
              break
            fi
            echo "waiting for PACS after cleanup (attempt $i/60)"
            sleep 2
          done
          test "$status" = healthy

      - name: Second test-store.sh run (must also pass)
        if: needs.changes.outputs.runtime == 'true'
        run: docker compose exec -T test-client /tests/test-store.sh

      - name: Dump logs on failure
        if: needs.changes.outputs.runtime == 'true' && (failure())
        run: |
          docker compose logs pacs-server || true
          docker compose logs test-client || true

      - name: Tear down stack
        if: needs.changes.outputs.runtime == 'true' && (always())
        run: docker compose down -v

  test-aggregator:
    name: test-all.sh aggregator (green-on-failure guard)
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this required context completes without Docker.'
      - name: Checkout
        if: needs.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4

      - name: Stage .env from defaults
        if: needs.changes.outputs.runtime == 'true'
        run: cp env.default .env

      - name: Build and start stack
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose up -d --build
          sleep 5

      - name: Wait for all SCP services to be healthy
        if: needs.changes.outputs.runtime == 'true'
        run: |
          services="pacs-server pacs-server-2 storescp-receiver mwl-server"
          for i in $(seq 1 60); do
            pending=""
            for svc in $services; do
              cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
              if [ -n "$cid" ]; then
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "starting")
              else
                status="starting"
              fi
              if [ "$status" != "healthy" ]; then
                pending="$pending $svc=$status"
              fi
            done
            if [ -z "$pending" ]; then
              echo "All SCP services are healthy"
              exit 0
            fi
            echo "waiting for SCP services (attempt $i/60, pending:$pending)"
            sleep 2
          done
          echo "ERROR: not all SCP services became healthy in time"
          for svc in $services; do
            cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
            if [ -n "$cid" ]; then
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "missing")
            else
              status="missing"
            fi
            if [ "$status" != "healthy" ]; then
              echo "=== $svc not healthy (status: $status); logs ==="
              docker compose logs --tail=100 "$svc" || true
            fi
          done
          exit 1

      - name: Verify load smoke rejects injected faults
        if: needs.changes.outputs.runtime == 'true'
        run: bash scripts/test-load-verdict.sh

      - name: Wipe PACS storage so the aggregator's C-STORE suite starts empty
        if: needs.changes.outputs.runtime == 'true'
        # test-all.sh runs test-store.sh, which requires an empty PACS
        # (ensure_clean_pacs) so its >= 3 study-count check is meaningful. The
        # entrypoint indexes synthetic data on first boot, so wipe on the host
        # and recreate the .indexed marker -- exactly like the isolated
        # test-store jobs. See scripts/entrypoint.sh.
        run: |
          for svc in pacs-server pacs-server-2; do
            docker compose exec -T "$svc" sh -c '
              find /dicom/db -mindepth 1 -delete 2>/dev/null || true
              mkdir -p "/dicom/db/${AE_TITLE}"
              touch "/dicom/db/${AE_TITLE}/.indexed"
            '
          done
          docker compose restart pacs-server pacs-server-2
          for i in $(seq 1 60); do
            cid=$(docker compose ps -q pacs-server)
            status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "pacs-server healthy after cleanup"
              break
            fi
            echo "waiting for PACS after cleanup (attempt $i/60)"
            sleep 2
          done
          test "$status" = healthy

      - name: Run the full aggregator and assert exit 0
        if: needs.changes.outputs.runtime == 'true'
        # Exercises test-all.sh's own verdict logic (the SUITES_FAILED gate),
        # which the per-script isolation jobs never cover. A green-on-failure
        # regression in the aggregator would fail this job.
        run: docker compose exec -T test-client /tests/test-all.sh

      - name: Dump logs on failure
        if: needs.changes.outputs.runtime == 'true' && (failure())
        run: |
          docker compose logs pacs-server || true
          docker compose logs test-client || true

      - name: Collect load integrity diagnostics
        if: needs.changes.outputs.runtime == 'true' && (failure())
        run: |
          docker compose exec -T test-client sh -c \
            "find /tmp -maxdepth 1 -type d -name 'load-smoke-*' -print0 | tar --null -T - -czf -" \
            > load-integrity-diagnostics.tgz

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.runtime == 'true' && (failure())
        with:
          name: load-integrity-diagnostics
          path: load-integrity-diagnostics.tgz

      - name: Tear down stack
        if: needs.changes.outputs.runtime == 'true' && (always())
        run: docker compose down -v

  test-adhoc-cmove:
    name: ad-hoc C-MOVE delivery (EXTRA_PEERS e2e)
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this required context completes without Docker.'
      - name: Checkout
        if: needs.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4

      - name: Stage .env with an EXTRA_PEERS-only destination
        if: needs.changes.outputs.runtime == 'true'
        run: |
          cp env.default .env
          # Register storescp-receiver under a NEW AE (ADHOC_SCP) that is NOT in
          # the static HostTable, so a successful C-MOVE delivery proves the
          # EXTRA_PEERS injection path works end-to-end (not the static peer).
          sed -i 's/^EXTRA_PEERS=.*/EXTRA_PEERS=adhoc=ADHOC_SCP:storescp-receiver:11112/' .env
          grep '^EXTRA_PEERS=adhoc=ADHOC_SCP:storescp-receiver:11112' .env

      - name: Build and start stack
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose up -d --build
          sleep 5

      - name: Wait for all SCP services to be healthy
        if: needs.changes.outputs.runtime == 'true'
        run: |
          services="pacs-server pacs-server-2 storescp-receiver mwl-server"
          for i in $(seq 1 60); do
            pending=""
            for svc in $services; do
              cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
              if [ -n "$cid" ]; then
                status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "starting")
              else
                status="starting"
              fi
              if [ "$status" != "healthy" ]; then
                pending="$pending $svc=$status"
              fi
            done
            if [ -z "$pending" ]; then
              echo "All SCP services are healthy"
              exit 0
            fi
            echo "waiting for SCP services (attempt $i/60, pending:$pending)"
            sleep 2
          done
          echo "ERROR: not all SCP services became healthy in time"
          for svc in $services; do
            cid=$(docker compose ps -q "$svc" 2>/dev/null | head -n1)
            if [ -n "$cid" ]; then
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid" 2>/dev/null || echo "missing")
            else
              status="missing"
            fi
            if [ "$status" != "healthy" ]; then
              echo "=== $svc not healthy (status: $status); logs ==="
              docker compose logs --tail=100 "$svc" || true
            fi
          done
          exit 1

      - name: C-MOVE to the EXTRA_PEERS-only destination and verify arrival
        if: needs.changes.outputs.runtime == 'true'
        run: docker compose exec -T -e ADHOC_DEST_AE=ADHOC_SCP test-client /tests/test-adhoc-cmove.sh

      - name: Dump logs on failure
        if: needs.changes.outputs.runtime == 'true' && (failure())
        run: |
          docker compose logs pacs-server || true
          docker compose logs storescp-receiver || true
          docker compose logs test-client || true

      - name: Tear down stack
        if: needs.changes.outputs.runtime == 'true' && (always())
        run: docker compose down -v

  test-tls-skip:
    name: test-tls.sh skips cleanly on the cleartext stack
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this required context completes without Docker.'
      - name: Checkout
        if: needs.changes.outputs.runtime == 'true'
        uses: actions/checkout@v4

      - name: Stage .env from defaults
        if: needs.changes.outputs.runtime == 'true'
        run: cp env.default .env

      - name: Build and start stack
        if: needs.changes.outputs.runtime == 'true'
        run: |
          docker compose up -d --build
          sleep 5

      - name: Assert test-tls.sh skips on the cleartext stack
        if: needs.changes.outputs.runtime == 'true'
        # test-tls.sh checks TLS_ENABLED before touching any SCP, so the default
        # (cleartext) stack must make it skip with exit 0. Proving the skip path
        # still works guards against a regression in the optional overlay.
        run: |
          out=$(docker compose exec -T test-client /tests/test-tls.sh)
          echo "$out"
          echo "$out" | grep -q "SKIP" || { echo "ERROR: expected test-tls.sh to SKIP on the cleartext stack"; exit 1; }
          echo "OK: test-tls.sh skipped cleanly"

      - name: Confirm the DCMTK facts behind the TLS and codec docs
        if: needs.changes.outputs.runtime == 'true'
        # Fail if a package update changes the documented TLS/codec capabilities.
        run: |
          probe() { docker compose exec -T test-client sh -c "$1"; }
          probe 'storescp --version'
          qr=$(probe 'dcmqrscp --help 2>&1 | grep -c -- --enable-tls || true')
          st=$(probe 'storescp --help 2>&1 | grep -c -- --enable-tls || true')
          ec=$(probe 'echoscu --help 2>&1 | grep -c -- --enable-tls || true')
          mv=$(probe 'movescu --help 2>&1 | grep -c -- --enable-tls || true')
          wl=$(probe 'wlmscpfs --help 2>&1 | grep -c -- --enable-tls || true')
          codecs=$(probe 'dpkg -L dcmtk | grep -cE "/usr/bin/dcm[cd](jpeg|jpls|rle)$" || true')
          echo "dcmqrscp --enable-tls lines: $qr (expected 1 or more)"
          echo "storescp --enable-tls lines: $st (expected 1 or more)"
          echo "echoscu --enable-tls lines: $ec (expected 1 or more)"
          echo "dcmtk codec tools: $codecs (expected 6)"
          if [ "$qr" -ge 1 ] && [ "$st" -ge 1 ] && [ "$ec" -ge 1 ] && [ "$mv" -eq 0 ] && [ "$wl" -eq 0 ] && [ "$codecs" -eq 6 ]; then
            echo "OK: the documented DCMTK facts hold"
          else
            echo "ERROR: a documented DCMTK fact changed; update the TLS and codec statements (#104)"
            exit 1
          fi

      - name: Dump logs on failure
        if: needs.changes.outputs.runtime == 'true' && (failure())
        run: docker compose logs test-client || true

      - name: Tear down stack
        if: needs.changes.outputs.runtime == 'true' && (always())
        run: docker compose -f docker-compose.yml -f docker-compose.tls.yml down -v

