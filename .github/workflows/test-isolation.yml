  test-tls-serving:
    name: TLS overlay accepts secure DICOM and rejects plaintext
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    env:
      DICOM_PORT: '12012'
      GENERATE_PIXEL_DATA: 'true'
    steps:
      - name: Require a successful path decision
        env:
          DECISION_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$DECISION_RESULT" = success
          case "$RUNTIME_REQUIRED" in true|false) ;; *) exit 1 ;; esac
      - name: Documentation-only change
        if: needs.changes.outputs.runtime != 'true'
        run: echo 'No runtime changes; this context completes without Docker.'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.runtime == 'true'
      - name: Start TLS overlay on a non-default port
        if: needs.changes.outputs.runtime == 'true'
        run: |
          cp env.default .env
          docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build --wait --wait-timeout 120
      - name: Verify secure C-ECHO and plaintext rejection
        if: needs.changes.outputs.runtime == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.tls.yml exec -T test-client /tests/test-tls.sh
      - name: Collect TLS evidence
        if: needs.changes.outputs.runtime == 'true' && always()
        run: |
          docker compose logs --no-color > tls-server.log
          docker compose exec -T test-client sh -c "find /tmp -maxdepth 1 -type d -name 'tls-overlay-*' -print0 | tar --null -T - -czf -" > tls-probes.tgz
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.runtime == 'true' && always()
        with:
          name: tls-overlay-evidence
          path: |
            tls-server.log
            tls-probes.tgz
      - name: Tear down stack
        if: needs.changes.outputs.runtime == 'true' && always()
        run: docker compose -f docker-compose.yml -f docker-compose.tls.yml down -v
